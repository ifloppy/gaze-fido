[package]
name = "gaze-fido-ui"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"

[[bin]]
name = "gaze-fido-ui"
path = "src/main.rs"
