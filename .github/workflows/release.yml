name: Linux release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian13:
    name: Debian 13 package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build package in Debian 13
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          docker run --rm -e VERSION="$version" -v "$GITHUB_WORKSPACE:/src" debian:trixie bash -euxo pipefail -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential ca-certificates clang cmake curl dpkg-dev gzip libclang-dev \
              libtss2-dev pkg-config qt6-base-dev qt6-declarative-dev qml6-module-org-kde-kirigami \
              qml6-module-qt-labs-platform qml6-module-qtquick qml6-module-qtquick-controls \
              qml6-module-qtquick-layouts qml6-module-qtquick-window qt6-qpa-plugins
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="/root/.cargo/bin:$PATH" CC=clang CXX=clang++ QMAKE=qmake6
            cd /src
            cargo build --release --locked --workspace
            packaging/release/build-deb.sh "$VERSION" debian13
          '
      - uses: actions/upload-artifact@v7
        with:
          name: debian13
          path: dist/*.deb
          if-no-files-found: error

  ubuntu2604:
    name: Ubuntu 26.04 package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build package in Ubuntu 26.04
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          docker run --rm -e VERSION="$version" -v "$GITHUB_WORKSPACE:/src" ubuntu:26.04 bash -euxo pipefail -c '
            find /etc/apt -name "*.sources" -exec sed -i "s/Components: main$/Components: main universe/" {} +
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential ca-certificates clang cmake curl dpkg-dev gzip libclang-dev \
              libtss2-dev pkg-config qt6-base-dev qt6-declarative-dev qml6-module-org-kde-kirigami \
              qml6-module-qt-labs-platform qml6-module-qtquick qml6-module-qtquick-controls \
              qml6-module-qtquick-layouts qml6-module-qtquick-window qt6-qpa-plugins
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="/root/.cargo/bin:$PATH" CC=clang CXX=clang++ QMAKE=qmake6
            cd /src
            cargo build --release --locked --workspace
            packaging/release/build-deb.sh "$VERSION" ubuntu26.04
          '
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu2604
          path: dist/*.deb
          if-no-files-found: error

  fedora44:
    name: Fedora 44 package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build RPM in Fedora 44
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          docker run --rm -e VERSION="$version" -v "$GITHUB_WORKSPACE:/src" fedora:44 bash -euxo pipefail -c '
            dnf install -y clang clang-devel cmake curl gcc-c++ kf6-kirigami-devel \
              openssl-devel pkgconf-pkg-config qt6-qtbase-devel qt6-qtdeclarative-devel \
              qt6-qtquickcontrols2-devel rpm-build tpm2-tss-devel
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="/root/.cargo/bin:$PATH" CC=clang CXX=clang++
            export QMAKE="$(command -v qmake6 || command -v qmake-qt6)"
            cd /src
            packaging/release/build-rpm.sh "$VERSION" fc44
          '
      - uses: actions/upload-artifact@v7
        with:
          name: fedora44
          path: dist/*.rpm
          if-no-files-found: error

  arch:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build package in Arch Linux
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" archlinux:base-devel bash -euxo pipefail -c '
            pacman -Syu --noconfirm
            pacman -S --needed --noconfirm clang cmake kirigami lld qqc2-desktop-style \
              qt6-base qt6-declarative rustup tpm2-tss
            useradd --create-home builder
            mkdir -p /src/target /src/packaging/arch
            chown -R builder:builder /src/target /src/ui /src/packaging/arch
            runuser -u builder -- bash -lc "export PATH=\$HOME/.cargo/bin:\$PATH; rustup toolchain install stable --profile minimal; rustup default stable; cd /src; cargo fetch --locked; cd packaging/arch; makepkg -f --nodeps --noconfirm"
            mkdir -p /src/dist
            package="$(find /src/packaging/arch -maxdepth 1 -type f -name "gaze-fido-[0-9]*.pkg.tar.zst" -print -quit)"
            test -n "$package"
            install -m644 "$package" /src/dist/
          '
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  source:
    name: Vendored source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create source archive
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          packaging/release/create-source-archive.sh "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*-source.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debian13, ubuntu2604, fedora44, arch, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Add checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          for asset in *; do
            if [ "$asset" = SHA256SUMS ]; then
              continue
            fi
            digest="$(sha256sum "$asset" | cut -d' ' -f1)"
            release_name="${asset//\~/.}"
            printf '%s  %s\n' "$digest" "$release_name"
          done > SHA256SUMS
          cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file packaging/release/NOTES.md --prerelease
          fi
